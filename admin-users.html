<!DOCTYPE html>
<html lang="en">
  <script>
  const ADMIN_PASSWORD = "RentDekhoAdmin123";
  const enteredPassword = prompt("Enter admin password");

  if (enteredPassword !== ADMIN_PASSWORD) {
    alert("Wrong password");
    window.location.href = "index.html";
  }
</script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Users - RentDekho</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f5f7fb;
      color:#222;
      padding:20px;
    }

    .topbar{
      background:#111184;
      color:white;
      padding:16px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
      border-radius:14px;
      margin-bottom:20px;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .top-actions a,
    .top-actions button{
      background:white;
      border:1px solid #ddd;
      padding:10px 14px;
      border-radius:10px;
      text-decoration:none;
      color:#111184;
      font-weight:bold;
      cursor:pointer;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap:14px;
      margin-bottom:20px;
    }

    .stat-box{
      background:white;
      border-radius:14px;
      padding:16px;
      box-shadow:0 4px 16px rgba(0,0,0,0.08);
    }

    .stat-box h3{
      margin:0;
      font-size:28px;
      color:#111184;
    }

    .stat-box p{
      margin:8px 0 0;
      color:#555;
      font-size:14px;
      font-weight:bold;
    }

    .filters{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      margin-bottom:20px;
    }

    .filters input,
    .filters select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:14px;
      background:white;
      box-sizing:border-box;
    }

    .user-list{
      display:grid;
      gap:14px;
    }

    .user-card{
      background:white;
      border-radius:16px;
      padding:16px;
      box-shadow:0 4px 16px rgba(0,0,0,0.08);
      border-left:6px solid #111184;
    }

    .user-card.owner{
      border-left-color:#ff5e00;
    }

    .user-card.tenant{
      border-left-color:#111184;
    }

    .user-title{
      font-size:18px;
      font-weight:bold;
      margin-bottom:10px;
      color:#111827;
    }

    .user-row{
      margin:6px 0;
      font-size:15px;
      color:#374151;
      line-height:1.5;
      word-break:break-word;
    }

    .badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      color:white;
      margin-right:6px;
    }

    .badge.owner{
      background:#ff5e00;
    }

    .badge.tenant{
      background:#111184;
    }

    .badge.free{
      background:#6b7280;
    }

    .badge.premium{
      background:#16a34a;
    }

    .empty{
      background:white;
      border-radius:14px;
      padding:20px;
      text-align:center;
      color:#666;
      box-shadow:0 4px 16px rgba(0,0,0,0.08);
    }

    @media (max-width: 768px){
      body{
        padding:14px;
      }

      .filters{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">RentDekho Admin Users</div>

  <div class="top-actions">
    <a href="admin.html">← Back to Admin</a>
    <button onclick="loadUsers()">Refresh Users</button>
  </div>

  <div class="stats">
    <div class="stat-box">
      <h3 id="totalUsers">0</h3>
      <p>Total Users</p>
    </div>
    <div class="stat-box">
      <h3 id="tenantCount">0</h3>
      <p>Tenants</p>
    </div>
    <div class="stat-box">
      <h3 id="ownerCount">0</h3>
      <p>Owners</p>
    </div>
    <div class="stat-box">
      <h3 id="premiumCount">0</h3>
      <p>Premium Users</p>
    </div>
  </div>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search by name / phone / email / user ID" oninput="applyFilters()">
    <select id="categoryFilter" onchange="applyFilters()">
      <option value="">All Categories</option>
      <option value="tenant">Tenant</option>
      <option value="owner">Owner</option>
    </select>
  </div>

  <div id="userList" class="user-list"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCV2KxqvgZE2soovOp5TxDK35hZh6p1pvA",
      authDomain: "rentdekho-90245.firebaseapp.com",
      projectId: "rentdekho-90245",
      storageBucket: "rentdekho-90245.firebasestorage.app",
      messagingSenderId: "175577928788",
      appId: "1:175577928788:web:0eac251ef0cfb7a99bc9c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allUsers = [];

    function updateStats(users){
      const total = users.length;
      const tenants = users.filter(item => (item.category || "").toLowerCase() === "tenant").length;
      const owners = users.filter(item => (item.category || "").toLowerCase() === "owner").length;
      const premium = users.filter(item => (item.planType || "").toLowerCase() === "premium").length;

      document.getElementById("totalUsers").innerText = total;
      document.getElementById("tenantCount").innerText = tenants;
      document.getElementById("ownerCount").innerText = owners;
      document.getElementById("premiumCount").innerText = premium;
    }

    function renderUsers(users){
      const userList = document.getElementById("userList");
      userList.innerHTML = "";

      if(users.length === 0){
        userList.innerHTML = `<div class="empty">No users found.</div>`;
        return;
      }

      users.forEach((user) => {
        const category = (user.category || "tenant").toLowerCase();
        const planType = (user.planType || "free").toLowerCase();

        const card = document.createElement("div");
        card.className = `user-card ${category}`;

        card.innerHTML = `
          <div class="user-title">
            <span class="badge ${category}">${category === "owner" ? "Owner" : "Tenant"}</span>
            <span class="badge ${planType}">${planType === "premium" ? "Premium" : "Free"}</span>
          </div>

          <div class="user-row"><b>Name:</b> ${user.name || "N/A"}</div>
          <div class="user-row"><b>User ID:</b> ${user.userId || "N/A"}</div>
          <div class="user-row"><b>Phone:</b> ${user.phone || "N/A"}</div>
          <div class="user-row"><b>Email:</b> ${user.email || "N/A"}</div>
          <div class="user-row"><b>Category:</b> ${user.category || "tenant"}</div>
          <div class="user-row"><b>Plan Type:</b> ${user.planType || "free"}</div>
          <div class="user-row"><b>Payment Received:</b> ${user.paymentReceived === true ? "Yes" : "No"}</div>
          <div class="user-row"><b>Created At:</b> ${user.createdAt || "N/A"}</div>
        `;

        userList.appendChild(card);
      });
    }

    window.applyFilters = function(){
      const searchText = document.getElementById("searchInput").value.trim().toLowerCase();
      const categoryFilter = document.getElementById("categoryFilter").value;

      let filteredUsers = [...allUsers];

      if(categoryFilter){
        filteredUsers = filteredUsers.filter(item => (item.category || "").toLowerCase() === categoryFilter);
      }

      if(searchText){
        filteredUsers = filteredUsers.filter(item => {
          const name = (item.name || "").toLowerCase();
          const phone = (item.phone || "").toLowerCase();
          const email = (item.email || "").toLowerCase();
          const userId = (item.userId || "").toLowerCase();

          return (
            name.includes(searchText) ||
            phone.includes(searchText) ||
            email.includes(searchText) ||
            userId.includes(searchText)
          );
        });
      }

      updateStats(filteredUsers);
      renderUsers(filteredUsers);
    };

    window.loadUsers = async function(){
      const querySnapshot = await getDocs(collection(db, "users"));
      allUsers = [];

      querySnapshot.forEach((docSnap) => {
        allUsers.push({
          id: docSnap.id,
          ...docSnap.data()
        });
      });

      allUsers.sort((a, b) => {
        const timeA = new Date(a.createdAt || 0).getTime();
        const timeB = new Date(b.createdAt || 0).getTime();
        return timeB - timeA;
      });

      applyFilters();
    };

    loadUsers();
  </script>

</body>
</html>
