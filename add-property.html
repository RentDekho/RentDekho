<!DOCTYPE html>
<html>
<head>
  <title>Add Property - RentDekho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .container{
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    h2{
      text-align: center;
      margin-bottom: 20px;
      color: #1a73e8;
    }

    label{
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea{
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    textarea{
      resize: vertical;
      min-height: 100px;
    }

    button{
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-link{
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
    }

    #status{
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>

    <h2>Add Your Property</h2>

    <form id="propertyForm">
      <label for="title">Property Title</label>
      <input type="text" id="title" required>

      <label for="type">Property Type</label>
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="Room">Room</option>
        <option value="Flat">Flat</option>
        <option value="House">House</option>
        <option value="PG">PG</option>
        <option value="Shop">Shop</option>
      </select>

      <label for="city">City</label>
      <input type="text" id="city" required>

      <label for="address">Address / Area</label>
      <input type="text" id="address" required>

      <label for="price">Monthly Rent Price</label>
      <input type="number" id="price" required>

      <label for="owner">Owner Name</label>
      <input type="text" id="owner" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required>

      <label for="image">Property Image URL</label>
      <input type="url" id="image" required>

      <label for="desc">Description</label>
      <textarea id="desc" required></textarea>

      <button type="submit">Submit Property</button>

      <div id="status"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCV2KxqvgZE2soovOp5TxDK35hZh6p1pvA",
      authDomain: "rentdekho-90245.firebaseapp.com",
      projectId: "rentdekho-90245",
      storageBucket: "rentdekho-90245.firebasestorage.app",
      messagingSenderId: "175577928788",
      appId: "1:175577928788:web:0eac251ef0cfb7a99bc9c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("propertyForm");
    const statusDiv = document.getElementById("status");

    form.addEventListener("submit", async function(e){
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const type = document.getElementById("type").value;
      const city = document.getElementById("city").value.trim();
      const address = document.getElementById("address").value.trim();
      const price = document.getElementById("price").value.trim();
      const owner = document.getElementById("owner").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const image = document.getElementById("image").value.trim();
      const desc = document.getElementById("desc").value.trim();

      try {
        await addDoc(collection(db, "properties"), {
          title: title,
          type: type,
          city: city,
          address: address,
          price: price,
          owner: owner,
          phone: phone,
          image: image,
          desc: desc,
          createdAt: new Date().toISOString()
        });

        statusDiv.innerText = "Property added successfully!";
        statusDiv.style.color = "green";

        alert("Property added successfully!");
        form.reset();
        window.location.href = "index.html";
      } catch (error) {
        console.error(error);
        statusDiv.innerText = "Error saving property.";
        statusDiv.style.color = "red";
      }
    });
  </script>

</body>
</html>
