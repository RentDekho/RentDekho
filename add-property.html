<!DOCTYPE html>
<html>
<head>
<title>Add Property - RentDekho</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
padding:20px;
background:#f5f5f5;
}

h2{
text-align:center;
}

input,select,textarea{
width:100%;
padding:12px;
margin-bottom:12px;

}

button{
width:100%;

}

</style>

</head>

<body>

<h2>Add Your Property</h2>

<form id="propertyForm">

<label>Owner Name</label>
<input type="text" id="owner" placeholder="Enter your name" required>

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter phone number" required>

<label>City</label>
<input type="text" id="city" placeholder="City" required>

<label>Rent Price</label>
<input type="number" id="price" placeholder="Monthly rent" required>

<label>Property Type</label>
<select id="type">
<option>Flat</option>
<option>Room</option>
<option>PG</option>
<option>House</option>
</select>

<label>Property Title</label>
<input type="text" id="title" placeholder="Example: 1BHK Room for Rent" required>

<label>Property Image (Paste Image URL)</label>
<input type="text" id="image" placeholder="Paste image link">

<label>Description</label>
<textarea id="desc" placeholder="Describe your property"></textarea>

<button type="submit">Submit Property</button>

</form>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

storageBucket:"rentdekho-90245.firebasestorage.app",
messagingSenderId:"175577928788",
appId:"1:175577928788:web:0eac251ef0cfb7a99bc9c1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("propertyForm").addEventListener("submit", async function(e){

e.preventDefault();

const owner=document.getElementById("owner").value
const phone=document.getElementById("phone").value
const city=document.getElementById("city").value
const price=document.getElementById("price").value
const type=document.getElementById("type").value
const title=document.getElementById("title").value
const image=document.getElementById("image").value
const desc=document.getElementById("desc").value

await addDoc(collection(db,"properties"),{

owner:owner,
phone:phone,
city:city,
price:price,
type:type,
title:title,
image:image,
desc:desc

});

alert("Property Added Successfully");

window.location="index.html";

});

</script>

</body>
