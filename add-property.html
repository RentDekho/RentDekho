<!DOCTYPE html>
<html>
<head>
<title>Add Property - RentDekho</title>
</head>

<body style="font-family:Arial;padding:20px">

<h2>Add Your Property</h2>

<form>

<label>Owner Name</label><br>
<input type="text" placeholder="Enter your name"><br><br>

<label>Phone Number</label><br>
<input type="tel" placeholder="Enter phone number"><br><br>

<label>City</label><br>
<input type="text" placeholder="City"><br><br>

<label>Rent Price</label><br>
<input type="number" placeholder="Monthly rent"><br><br>

<label>Property Type</label><br>
<select>
<option>Flat</option>
<option>Room</option>
<option>PG</option>
<option>House</option>
</select><br><br>
<label>Upload Property Image</label><br>
<input type="file"><br><br>
<button type="submit">Submit Property</button>

</form>

</body>
</html>
