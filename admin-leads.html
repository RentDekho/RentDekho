<!DOCTYPE html>
<html>
<head>
  <title>Add Property - RentDekho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .container{
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    h2{
      text-align: center;
      margin-bottom: 20px;
      color: #1a73e8;
    }

    label{
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea{
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    input[readonly]{
      background: #f1f5f9;
      color: #555;
      cursor: not-allowed;
    }

    textarea{
      resize: vertical;
      min-height: 100px;
    }

    button{
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-link{
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
    }

    #status{
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    #preview{
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
      border: 1px solid #ddd;
    }

    .login-warning{
      background:#fff4e5;
      color:#9a3412;
      border:1px solid #fed7aa;
      padding:12px;
      border-radius:10px;
      margin-bottom:16px;
      font-size:14px;
      display:none;
    }

    .small-note{
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>

    <h2>Add Your Property</h2>

    <div id="loginWarning" class="login-warning">
      Please login first from homepage before adding a property.
    </div>

    <form id="propertyForm">
      <label for="title">Property Title</label>
      <input type="text" id="title" required>

      <label for="type">Property Type</label>
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="Room">Room</option>
        <option value="Flat">Flat</option>
        <option value="House">House</option>
        <option value="PG">PG</option>
        <option value="Shop">Shop</option>
      </select>

      <label for="city">City</label>
      <input type="text" id="city" required>

      <label for="address">Address / Area</label>
      <input type="text" id="address" required>

      <label for="price">Monthly Rent Price</label>
      <input type="number" id="price" required>

      <label for="owner">Owner Name</label>
      <input type="text" id="owner" readonly>
      <div class="small-note">Auto-filled from logged-in account</div>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" readonly>
      <div class="small-note">Auto-filled from logged-in account</div>

      <label for="imageFile">Property Image</label>
      <input type="file" id="imageFile" accept="image/*" required>

      <img id="preview" alt="Preview">

      <label for="desc">Description</label>
      <textarea id="desc" required></textarea>

      <button type="submit" id="submitBtn">Submit Property</button>

      <div id="status"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCV2KxqvgZE2soovOp5TxDK35hZh6p1pvA",
      authDomain: "rentdekho-90245.firebaseapp.com",
      projectId: "rentdekho-90245",
      storageBucket: "rentdekho-90245.firebasestorage.app",
      messagingSenderId: "175577928788",
      appId: "1:175577928788:web:0eac251ef0cfb7a99bc9c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("propertyForm");
    const statusDiv = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const imageFileInput = document.getElementById("imageFile");
    const preview = document.getElementById("preview");
    const loginWarning = document.getElementById("loginWarning");

    let finalImageData = "";

    function normalizePhone(phone) {
      return String(phone || "").replace(/\D/g, "").trim();
    }

    function fillLoggedInUserData() {
      const currentUser = JSON.parse(localStorage.getItem("rentdekhoCurrentUser") || "null");

      if (!currentUser) {
        loginWarning.style.display = "block";
        document.getElementById("owner").value = "";
        document.getElementById("phone").value = "";
        return null;
      }

      document.getElementById("owner").value = currentUser.name || "";
      document.getElementById("phone").value = currentUser.phone || "";
      loginWarning.style.display = "none";

      return currentUser;
    }

    imageFileInput.addEventListener("change", async function () {
      const file = imageFileInput.files[0];

      if (!file) {
        finalImageData = "";
        preview.style.display = "none";
        return;
      }

      try {
        finalImageData = await compressImage(file, 900, 0.7);
        preview.src = finalImageData;
        preview.style.display = "block";
      } catch (error) {
        console.error("Image error:", error);
        alert("Image process nahi ho paya.");
      }
    });

    function compressImage(file, maxWidth = 900, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = function (event) {
          const img = new Image();

          img.onload = function () {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(compressedDataUrl);
          };

          img.onerror = reject;
          img.src = event.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function checkFreeListingLimit(phoneNumber) {
      const normalizedPhone = normalizePhone(phoneNumber);
      const querySnapshot = await getDocs(collection(db, "properties"));

      let hasExistingFreePost = false;

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();

        const savedPhone = normalizePhone(data.phone);
        const savedPlan = (data.planType || "free").toLowerCase();
        const savedStatus = (data.status || "pending").toLowerCase();

        const isActiveLike =
          savedStatus === "pending" ||
          savedStatus === "approved";

        if (
          savedPhone === normalizedPhone &&
          savedPlan === "free" &&
          isActiveLike
        ) {
          hasExistingFreePost = true;
        }
      });

      return hasExistingFreePost;
    }

    form.addEventListener("submit", async function(e){
      e.preventDefault();

      const currentUser = fillLoggedInUserData();

      if (!currentUser) {
        statusDiv.innerText = "Please login first from homepage.";
        statusDiv.style.color = "red";
        return;
      }

      const title = document.getElementById("title").value.trim();
      const type = document.getElementById("type").value;
      const city = document.getElementById("city").value.trim();
      const address = document.getElementById("address").value.trim();
      const price = document.getElementById("price").value.trim();
      const owner = document.getElementById("owner").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const desc = document.getElementById("desc").value.trim();

      if (!finalImageData) {
        statusDiv.innerText = "Please select an image.";
        statusDiv.style.color = "red";
        return;
      }

      if (finalImageData.length > 900000) {
        statusDiv.innerText = "Image too large. Please use a smaller image.";
        statusDiv.style.color = "red";
        return;
      }

      const cleanPhone = normalizePhone(phone);

      if (cleanPhone.length < 10 && !cleanPhone.startsWith("google_")) {
        statusDiv.innerText = "Please login with a valid phone number account.";
        statusDiv.style.color = "red";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusDiv.innerText = "";

      try {
        const alreadyHasFreePost = await checkFreeListingLimit(cleanPhone);

        if (alreadyHasFreePost) {
          statusDiv.innerText = "This phone number already has one free active listing. For another listing, contact RentDekho for premium plan.";
          statusDiv.style.color = "red";
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Property";
          return;
        }

        await addDoc(collection(db, "properties"), {
          title: title,
          type: type,
          city: city,
          address: address,
          price: price,
          owner: owner,
          phone: cleanPhone,
          image: finalImageData,
          desc: desc,
          createdAt: new Date().toISOString(),
          status: "pending",
          verified: false,
          displayOrder: 999,
          planType: "free",
          paymentReceived: false,
          trending: false,
          ownerUserId: currentUser.userId || "",
          ownerName: currentUser.name || owner,
          ownerPhone: currentUser.phone || cleanPhone,
          ownerCategory: "owner"
        });

        if (currentUser.userId) {
          await updateDoc(doc(db, "users", currentUser.userId), {
            category: "owner"
          });

          currentUser.category = "owner";
          localStorage.setItem("rentdekhoCurrentUser", JSON.stringify(currentUser));
        }

        statusDiv.innerText = "Property submitted successfully! It is pending for approval.";
        statusDiv.style.color = "green";

        alert("Property submitted successfully! It is pending for approval.");

        form.reset();
        preview.style.display = "none";
        finalImageData = "";
        fillLoggedInUserData();
        window.location.href = "index.html";

      } catch (error) {
        console.error(error);
        statusDiv.innerText = "Error saving property.";
        statusDiv.style.color = "red";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Property";
      }
    });

    fillLoggedInUserData();
  </script>

</body>
</html>
